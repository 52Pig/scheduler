[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "task-scheduler"
version = "0.1.0"
description = "A small, persistent scheduler with a web UI and CLI"
requires-python = ">=3.9"
dependencies = [
  "apscheduler>=3.10,<4",
  "eval-type-backport>=0.2",
  "fastapi>=0.110,<1",
  "pydantic>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.4,<1"]

[project.scripts]
scheduler = "scheduler.cli:main"

[tool.setuptools.packages.find]
include = ["scheduler*", "deploy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
